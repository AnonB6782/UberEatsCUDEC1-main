  <!-- PANEL LATERAL PARA AGREGAR PLATILLO / CÁMARA (Izquierda) -->
  <div id="side-form" class="sidenav side-form" style="padding: 20px; width: 300px;">
    <form id="formularioPlatillo" class="add-recipe">
      <h5 class="green-text text-darken-2" style="font-weight: bold;">Agregar Platillo</h5>
      <div class="divider" style="margin-bottom: 25px;"></div>

      <!-- Campo oculto donde se guarda la cadena Base64 de la foto -->
      <input type="hidden" id="foto" value="">

      <div class="input-field" style="margin-bottom: 30px;">
        <input placeholder="ejemplo: Pizza" id="title" type="text" class="validate" required>
        <label for="title" class="active">Nombre del Platillo</label>
      </div>

      <div class="input-field" style="margin-bottom: 30px;">
        <input placeholder="ejemplo: Queso, Peperoni" id="ingredients" type="text" class="validate" required>
        <label for="ingredients" class="active">Ingredientes</label>
      </div>

      <div class="input-field" style="margin-bottom: 30px;">
        <input placeholder="ejemplo: 90" id="price" type="number" step="0.01" class="validate" required>
        <label for="price" class="active">Precio ($ MXN)</label>
      </div>

      <div class="input-field center" style="margin-bottom: 25px;">
        <button type="submit" class="btn-small green waves-effect waves-light">Guardar Platillo</button>
      </div>
    </form>

    <div class="divider" style="margin: 20px 0;"></div>

    <!-- SECCIÓN DE CAPTURA DE FOTO -->
    <div class="center">
      <button id="btnFoto" type="button" class="btn-small orange darken-2 waves-effect waves-light" style="margin-bottom: 8px;">Iniciar Cámara</button>
      <button id="btnCapturar" type="button" class="btn-small red waves-effect waves-light" style="margin-bottom: 15px;">Tomar Foto</button>
      
      <div id="camara" style="margin-bottom: 15px;">
        <video id="video" style="width: 100%; max-width: 260px; background-color: #000; border-radius: 4px;" autoplay playsinline>No hay video disponible</video>
      </div>

      <canvas id="canvas" style="display: none;"></canvas>

      <div id="salida" style="margin-bottom: 15px;">
        <img id="fotoPreview" src="" alt="Previsualización de la foto" style="width: 100%; max-width: 260px; border-radius: 4px; border: 1px dashed #ccc; display: block; margin: 0 auto;">
      </div>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL DE PLATILLOS -->
  <div class="container grey-text text-darken-1 section">
    <h4 class="center-align" style="margin-bottom: 30px; font-weight: 300;">Menú del Día</h4>
    <div class="recipes"></div>
