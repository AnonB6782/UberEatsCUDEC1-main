<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Food Ninja</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Ruta CSS corregida -->
  <link type="text/css" href="../css/styles.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</head>
<body class="grey lighten-4">

  <nav class="z-depth-0 white">
    <div class="nav-wrapper container">
      <a href="/" class="brand-logo green-text text-darken-2" style="font-weight: bold;">Uber Eats CUDEC</a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu" style="cursor: pointer;">menu</i>
      </span>
    </div>
  </nav>

  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">UberEatsCUDEC</a></li>
    <li><a href="/" class="waves-effect"><i class="material-icons">home</i>Inicio</a></li>
    <li><a href="/pages/pedidos.html" class="waves-effect"><i class="material-icons">shopping_basket</i>Generar Pedido</a></li>
    <li><a href="/pages/about.html" class="waves-effect"><i class="material-icons">info</i>Acerca de</a></li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/contact.html" class="waves-effect"><i class="material-icons">mail_outline</i>Contacto</a></li>
  </ul>

  <div class="container grey-text text-darken-1 section">
    <form id="formularioPedido">
      <h5>Nuevo Pedido</h5>
      <div class="divider" style="margin-bottom: 25px;"></div>

      <div style="margin-bottom: 30px;">
        <label for="listaplatillos" class="active" style="font-size: 0.9rem;">Selecciona tu Platillo</label>
        <select id="listaplatillos" class="browser-default" style="margin-top: 8px;" required>
          <option value="" disabled selected>-- Elige un platillo de la carta --</option>
        </select>
      </div>

      <div class="input-field" style="margin-bottom: 30px;">
        <input placeholder="ejemplo: Juan Pérez" id="txtNombre" type="text" class="validate" required>
        <label for="txtNombre" class="active">Nombre del Cliente</label>
      </div>

      <div class="input-field" style="margin-bottom: 30px;">
        <textarea id="txtDireccion" class="materialize-textarea validate" placeholder="Ingresa tu dirección manual u obténla con el botón" required></textarea>
        <label for="txtDireccion" class="active">Dirección de Entrega</label>
      </div>

      <p id="ubicacion" class="green-text text-darken-2" style="font-weight: bold; margin: 15px 0;"></p>

      <div style="margin-bottom: 25px;">
        <button id="btnUbicacion" type="button" class="btn-small orange darken-2 waves-effect waves-light">Ubicación</button>
      </div>

      <div id="mapa" style="width: 100%; height: 350px; margin-bottom: 30px; border-radius: 4px; border: 1px solid #ccc;"></div>

      <div class="input-field center" style="margin-top: 35px; margin-bottom: 20px;">
        <button id="btnGuardar" type="submit" class="btn green waves-effect waves-light">Guardar Pedido</button>
      </div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>
  
  <!-- Rutas JS apuntando correctamente subiendo un nivel -->
  <script src="../js/firebase.js"></script>
  <script src="../js/pedidos.js"></script>

</body>
</html>
