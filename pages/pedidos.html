  <!-- FORMULARIO PRINCIPAL DE PEDIDO -->
  <div class="container section">
    <h4 class="grey-text text-darken-2" style="font-weight: 300;">Nuevo Pedido</h4>
    <div class="divider" style="margin-bottom: 30px;"></div>

    <form id="formularioPedido" class="card-panel white" style="padding: 30px; border-radius: 8px;">
      
      <!-- Select de Platillos (ID: listaplatillos) -->
      <div class="input-field" style="margin-bottom: 30px;">
        <select id="listaplatillos" required>
          <option value="" disabled selected>-- Elige un platillo de la carta --</option>
        </select>
        <label>Selecciona tu Platillo</label>
      </div>

      <!-- Nombre del Cliente (ID: txtNombre) -->
      <div class="input-field" style="margin-bottom: 30px;">
        <input id="txtNombre" type="text" class="validate" placeholder="ejemplo: Juan Pérez" required>
        <label for="txtNombre" class="active">Nombre del Cliente</label>
      </div>

      <!-- Dirección de Entrega (ID: txtDireccion) -->
      <div class="input-field" style="margin-bottom: 10px;">
        <input id="txtDireccion" type="text" class="validate" placeholder="Ingresa tu dirección manual u obténla con el botón" required>
        <label for="txtDireccion" class="active">Dirección de Entrega</label>
      </div>

      <!-- Botón Ubicación & Texto de Ciudad/País (ID: ubicacion) -->
      <div class="left-align" style="margin-bottom: 15px;">
        <button id="btnUbicacion" type="button" class="btn-small blue darken-1 waves-effect waves-light">
          <i class="material-icons left">my_location</i> Usar mi ubicación actual
        </button>
        <span id="ubicacion" class="grey-text text-darken-1" style="margin-left: 15px; font-weight: 500;"></span>
      </div>

      <!-- MAPA (ID: mapa) -->
      <div id="mapa"></div>

      <!-- Botón de Confirmación -->
      <div class="center" style="margin-top: 20px;">
        <button type="submit" class="btn green waves-effect waves-light">
          Confirmar Pedido <i class="material-icons right">send</i>
        </button>
      </div>
    </form>
  </div>
